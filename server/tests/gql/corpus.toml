# GQL conformance corpus (STORY-0010 E2, E3). Each case is one statement and its expected
# outcome:
#   ok           parses (supported and partial features)
#   unsupported  is rejected with a parse error naming exactly `feature` (REQ-0003 AC3)
# Every feature marked supported or partial in docs/gql-conformance.toml needs at least one
# `ok` case; tests/gql_conformance.rs enforces that.

# ------------------------------------------------------------------ supported: patterns
[[case]]
feature = "G010"
gql = "MATCH WALK (a)-[e]->(b) RETURN a"
expect = "ok"

[[case]]
feature = "G014"
gql = "MATCH WALK PATH (a)-[e]->(b) RETURN b"
expect = "ok"

[[case]]
