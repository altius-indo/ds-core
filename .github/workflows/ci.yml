name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup installs the channel pinned in rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      # STORY-0010 E1 (REQ-0003 AC1): the GQL conformance matrix lists every ISO/IEC 39075
      # optional feature with a status.
      - name: GQL conformance matrix vs ISO/IEC 39075
        run: scripts/gql/check-matrix.py docs/gql-conformance.toml --against "$(scripts/gql/fetch-iso-features.sh)" --require-status

  # STORY-0028 E2 (REQ-0041 AC2): the release suite on native amd64 and arm64 runners.
  suite:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Release suite
        run: cargo deny check && scripts/ci/run-matrix.sh --arch amd64,arm64 --suite release

  # STORY-0021: TLS policy scan of client and peer ports (REQ-0035) and mTLS refusal (REQ-0036).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: E1 TLS scan and plaintext refusal
        run: scripts/security/tls-scan.sh --ports client,peer --forbid sslv3,tls1.0,tls1.1,non-aead --expect-plaintext-refused
      - name: E2 peer certificate rejection
        run: cargo test --locked -p dscore-server --test security -- mtls_reject_invalid_peer

  # STORY-0036: Rust-only/unsafe policy (REQ-0048) and native allow-list (REQ-0049).
  # Each gate also runs its seeded-violation fixtures and fails if they are not rejected.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: E1 language and unsafe policy
        run: scripts/ci/rust-policy.sh --forbid-langs c,cpp,go --require-safety-comments --report-unsafe-count --negative-fixture tests/fixtures/rust-policy
      - name: E2 native allow-list
        run: cargo deny check && scripts/ci/ffi-allowlist.sh deny.native.toml --link-audit rustc-link-lib,readelf --negative-fixture tests/fixtures/unlisted-native --require owner,purpose,licence,version,reviewed
      - name: Unsafe count report
        uses: actions/upload-artifact@v4
        with:
          name: unsafe-count
          path: target/policy/unsafe-count.json
