[package]
name = "dscore-server"
description = "DS-CORE server: storage, Raft, transactions, GQL engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dscore-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "trace", "testing"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
